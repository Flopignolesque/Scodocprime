name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ScodocPrime.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScodocPrime-apk
          path: ScodocPrime.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScoDoc Prime v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ScodocPrime.apk
          body: Télécharge ScodocPrime.apk depuis ton téléphone et installe-le.
